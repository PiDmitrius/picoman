name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p release

          go build -trimpath -ldflags="-s -w" -o release/picoman-${{ github.ref_name }}-linux-amd64 ./cmd/picoman
          sha256sum release/picoman-${{ github.ref_name }}-linux-amd64 > release/picoman-${{ github.ref_name }}-linux-amd64.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
