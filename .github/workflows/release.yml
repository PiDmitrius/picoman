name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: golang:1.26.5-trixie
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p release

          name=picoman-${{ github.ref_name }}-linux-amd64
          go build -buildvcs=false -trimpath -ldflags="-s -w" -o release/$name ./cmd/picoman
          if readelf -n release/$name | grep 'ISA needed' | grep -q 'x86-64-v'; then
            readelf -n release/$name | grep 'ISA needed'
            exit 1
          fi
          (cd release && sha256sum $name > $name.sha256)

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
